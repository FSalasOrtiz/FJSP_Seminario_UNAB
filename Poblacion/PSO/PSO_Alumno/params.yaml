# Parámetros de PSO_Alumno (Particle Swarm Optimization, clase FJSP_PSO de
# algorithm.py).
#
# Valores por defecto — sin calibrar con Optuna todavía. Son los valores
# del bloque __main__ de algorithm.py (salvo la semilla, que la fija
# revision/sanity_check.py). Cada valor necesita justificación: "funcionó
# bien" no es justificación válida.
#
# Diferencia de diseño con PSO_IA: este PSO usa UNA inercia inicial
# (inertia) que se reduce linealmente en 0.3 a lo largo de la corrida
# (valor fijo en solve()), en vez del par w_max / w_min de PSO_IA.

implementacion: PSO_Alumno
version: "1.0.0"

parametros:
  population_size:
    valor: 40
    rango_sugerido: [15, 60]
    justificacion: >
      Tamaño del enjambre. Mismo rango que n_particulas de PSO_IA, para no
      darle de entrada más margen a una implementación que a la otra.

  inertia:
    valor: 0.7
    rango_sugerido: [0.5, 1.0]
    justificacion: >
      Inercia al inicio de la búsqueda; solve() la reduce linealmente
      hasta inertia - 0.3 en la última iteración. El límite inferior del
      rango (0.5) evita que la inercia final quede cerca de 0 o negativa.

  c1:
    valor: 1.4
    rango_sugerido: [1.0, 2.5]
    justificacion: "Coeficiente cognitivo (atracción hacia el mejor personal). Mismo rango que PSO_IA."

  c2:
    valor: 1.4
    rango_sugerido: [1.0, 2.5]
    justificacion: "Coeficiente social (atracción hacia el mejor global). Mismo rango que PSO_IA."

criterio_de_parada: >
  Número máximo de iteraciones (--iteraciones). FJSP_PSO.solve() no
  acepta límite de tiempo. Independiente de core/.

nota_de_convergencia: >
  solve() registra el mejor makespan por iteración, sin tiempo; por eso
  g1.csv / g1.png de esta implementación usan iteración en el eje X, no
  segundos como AG_IA.
