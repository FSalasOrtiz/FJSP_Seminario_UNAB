# Parámetros de AG_Alumno (Algoritmo Genético, implementación propia).
#
# Calibrados con Optuna (TPE, 100 trials, desde cero — pedido del profesor guía) — ver calibracion/calibrar_optuna.py
# y calibracion/mejores_parametros.json. Mismo script, mismos rangos y mismo
# objetivo que AG_IA: gap % promedio contra BKS sobre el mismo subconjunto de
# 10 instancias x 2 semillas x 60 generaciones/corrida. Mejor gap promedio de
# calibración: 7.44%.
# Cada valor necesita justificación: "funcionó bien" no es justificación válida.

implementacion: AG_Alumno
version: "2.0.0"

parametros:
  tam_poblacion:
    valor: 140
    rango_sugerido: [40, 150]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Quedó en la parte alta del
      rango, igual que en AG_IA (145): con más individuos el AG mantiene más
      diversidad de secuencias, y el costo por generación crece linealmente.

  prob_cruce:
    valor: 0.8864719209760815
    rango_sugerido: [0.7, 0.95]
    justificacion: "Calibrado con Optuna (ver calibracion/). Probabilidad de aplicar el cruce (POX en el orden + mezcla uniforme de máquinas) a un par de padres."

  prob_mut_os:
    valor: 0.22255828103770692
    rango_sugerido: [0.1, 0.4]
    justificacion: "Calibrado con Optuna (ver calibracion/). Probabilidad de intercambiar dos genes de un hijo (mutación del orden)."

  prob_mut_ms:
    valor: 0.123737759017434
    rango_sugerido: [0.1, 0.5]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Probabilidad de cambiar la
      máquina preferida de una operación. Quedó cerca del borde inferior:
      como el decodificador ya elige la máquina que termina antes, la
      máquina del gen solo decide los empates y mutarla aporta poco.

  k_torneo:
    valor: 2
    rango_sugerido: [2, 5]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Terminó en el borde inferior
      (presión selectiva baja); compensa el elitismo alto de abajo.

  elitismo:
    valor: 4
    rango_sugerido: [1, 5]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Los 4 mejores de cada
      generación pasan a la siguiente reemplazando a los peores hijos.

  estancamiento_max:
    valor: 21
    rango_sugerido: [8, 40]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Generaciones sin mejora del
      makespan global antes de inyectar inmigrantes aleatorios
      (mecanismo de diversificación).

  frac_inmigrantes:
    valor: 0.12762387483398513
    rango_sugerido: [0.1, 0.3]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Fracción de la población que
      se reemplaza por inmigrantes aleatorios al estancarse.

criterio_de_parada: >
  Número máximo de generaciones (--generaciones, 200 por defecto, igual que
  AG_IA), con un límite de tiempo opcional adicional (--tiempo-limite).
  Independiente de core/, igual que AG_IA.
