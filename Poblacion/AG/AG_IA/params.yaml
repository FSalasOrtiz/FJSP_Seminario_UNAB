# Parámetros de AG_IA (Algoritmo Genético, implementación con apoyo de Claude).
#
# Calibrados con Optuna (TPE, 40 trials) — ver calibracion/calibrar_optuna.py
# y calibracion/mejores_parametros.json. Objetivo minimizado: gap %
# promedio contra BKS sobre un subconjunto curado de 10 instancias (3
# familias del benchmark, tamaños 6x6 a 30x15) x 2 semillas x 60
# generaciones/corrida. Mejor gap promedio de calibración: 10.77%.
# Cada valor necesita justificación: "funcionó bien" no es justificación válida.

implementacion: AG_IA
version: "1.0.0"

parametros:
  tam_poblacion:
    valor: 150
    rango_sugerido: [40, 150]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Terminó en el borde
      superior del rango probado — indicio de que el óptimo real podría
      estar por encima de 150; el rango no se amplió por costo de tiempo
      (poblaciones más grandes escalan linealmente el costo de cada
      generación). Limitación conocida: si se recalibra, ampliar primero
      a algo como [40, 300].

  prob_cruce:
    valor: 0.9365471892068432
    rango_sugerido: [0.7, 0.95]
    justificacion: "Calibrado con Optuna (ver calibracion/) — quedó cerca del borde superior del rango, consistente con la literatura de AG (alta probabilidad de cruce es habitual)."

  prob_mut_os:
    valor: 0.34125353500427524
    rango_sugerido: [0.1, 0.4]
    justificacion: "Calibrado con Optuna (ver calibracion/). Probabilidad de mutar la secuencia (OS) de un hijo recién creado."

  prob_mut_ms:
    valor: 0.2504363714218985
    rango_sugerido: [0.1, 0.5]
    justificacion: "Calibrado con Optuna (ver calibracion/). Probabilidad de mutar la asignación de máquina (MS) de un hijo recién creado."

  k_torneo:
    valor: 3
    rango_sugerido: [2, 5]
    justificacion: "Calibrado con Optuna (ver calibracion/) — coincide con el valor convencional (ni tan chico ni tan grande la presión selectiva)."

  elitismo:
    valor: 1
    rango_sugerido: [1, 5]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Terminó en el borde
      inferior del rango probado; a diferencia de tam_poblacion, acá el
      límite inferior es un mínimo natural (no tiene sentido elitismo 0
      con este diseño), así que no es evidencia de rango insuficiente.

  estancamiento_max:
    valor: 20
    rango_sugerido: [8, 40]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Generaciones sin mejora
      del makespan global antes de inyectar inmigrantes aleatorios
      (mecanismo de diversificación).

  frac_inmigrantes:
    valor: 0.10013839299243679
    rango_sugerido: [0.1, 0.3]
    justificacion: >
      Calibrado con Optuna (ver calibracion/). Terminó prácticamente en
      el borde inferior del rango; podría valer la pena probar un rango
      inferior a 0.1 en una recalibración futura.

criterio_de_parada: >
  Número máximo de generaciones (--generaciones), con un límite de tiempo
  opcional adicional (--tiempo-limite). A diferencia de las metaheurísticas
  del experimento principal (que usan core.evaluation_budget.Presupuesto,
  medido en evaluaciones — D8 de METODOLOGIA.md), esta implementación es
  independiente de core/ y define su propio criterio de parada.
